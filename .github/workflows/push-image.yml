name: Push Image

on:
  push:
    branches: [ 'master' ]
    paths-ignore:
      - 'test'
      - 'README.md'
  pull_request:
    branches: [ 'master' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out thr repo
        uses: actions/checkout@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image -- cmd
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          file: docker/cmd.dockerfile
          tags: applerodite/repohcl-cmd:latest
      - name: Build and push Docker image -- service
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          file: docker/service.dockerfile
          tags: applerodite/repohcl:latest
