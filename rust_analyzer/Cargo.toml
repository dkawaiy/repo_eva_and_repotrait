[package]
name = "rust_analyzer_for_hcl"
version = "0.1.0"
edition = "2024"
authors = ["xqy"]
description = "Rust code analysis tool for generating structured JSON output"
license = "MIT"

[[bin]]
name = "rust_analyzer"
path = "src/main.rs"

[lib]
name = "rust_analyzer_lib"
path = "src/lib.rs"

[dependencies]
# Core parsing dependencies
syn = { version = "2.0", features = ["full", "extra-traits", "visit"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }

# Cargo integration
cargo_metadata = "0.18"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.10"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# File system operations
walkdir = "2.4"
glob = "0.3"
dirs = "5.0"

# String processing
regex = "1.10"

# Configuration parsing
toml = "0.8"

# HTML parsing
scraper = "0.18"
select = "0.6"

# Advanced semantic analysis
rustc-hash = "1.1"
indexmap = "2.0"
petgraph = "0.6"

# Type inference and HIR analysis
ra_ap_hir = "0.0.296"
ra_ap_hir_def = "0.0.296"
ra_ap_hir_ty = "0.0.296"
ra_ap_base_db = "0.0.296"
ra_ap_ide_db = "0.0.296"

# Macro expansion
proc-macro-error = "1.0"
syn-mid = "0.6"

# Async runtime (for potential future use)
tokio = { version = "1.0", features = ["full"], optional = true }

[build-dependencies]
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"

[features]
default = []
async = ["tokio"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
